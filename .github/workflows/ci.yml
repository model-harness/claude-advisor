name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: 2.1.310

jobs:
  engine:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 ./...

  plugin:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest release the installers accept, and the one CI pins.
        claude: ['2.1.293', '2.1.310']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Claude Code
        shell: bash
        env:
          CLAUDE_VERSION: ${{ matrix.claude || env.CLAUDE_CODE_VERSION }}
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_VERSION}"
      - run: claude plugin validate --strict ./plugin
      - run: claude plugin validate .
      - run: claude plugin test
        working-directory: plugin

  installers:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Warning,Error
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }

  install-from-source:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Claude Code
        shell: bash
        env:
          CLAUDE_VERSION: ${{ matrix.claude || env.CLAUDE_CODE_VERSION }}
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_VERSION}"
      - name: install.sh, latest published release
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bash install.sh 2>&1 | tee install.log
          grep -q "Build provenance verified" install.log
          claude plugin list --json | grep -q '"id": *"bedrock-advisor@model-harness"'
      - name: install.ps1, latest published release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./install.ps1 *>&1 | Tee-Object -Variable lines
          $log = $lines | Out-String
          if ($log -notmatch 'Build provenance verified') { throw 'provenance was not verified' }
          if (-not ((claude plugin list --json | ConvertFrom-Json) | Where-Object id -eq 'bedrock-advisor@model-harness')) { exit 1 }
      - name: install.sh
        if: runner.os != 'Windows'
        # Twice: the second run takes the reinstall path.
        run: |
          bash install.sh --from-source .
          bash install.sh --from-source .
          claude plugin list --json | grep -q '"id": *"bedrock-advisor@model-harness"'
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -FromSource .
          ./install.ps1 -FromSource .
          if (-not ((claude plugin list --json | ConvertFrom-Json) | Where-Object id -eq 'bedrock-advisor@model-harness')) { exit 1 }
