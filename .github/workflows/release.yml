name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Check the tag matches the plugin version
        run: |
          want="v$(jq -r .version plugin/.claude-plugin/plugin.json)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match plugin.json $want"; exit 1; }
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion --jq '[.[] | select(.conclusion != "")][0].conclusion')
          [ "$conclusion" = success ] || { echo "CI on $GITHUB_SHA is '${conclusion:-not run}'; tag a commit whose CI passed"; exit 1; }
      - name: Test
        working-directory: engine
        run: go test -count=1 ./...
      - name: Build
        working-directory: engine
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "../dist/advisor-engine_${os}_${arch}${ext}" ./cmd/advisor-engine
          done
          cd ../dist && sha256sum advisor-engine_* > checksums.txt && cat checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/advisor-engine_*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  # Install the release the way a user does, from the published one-liners.
  smoke:
    needs: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g "@anthropic-ai/claude-code@2.1.310"
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          CLAUDE_ADVISOR_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        # The point of this job is the user's exact one-liner. The script comes
        # from this repository at the release tag, the same trust as a checkout.
        # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
        run: |
          set -o pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/install.sh" | bash 2>&1 | tee install.log
          grep -q "Build provenance verified" install.log
          "$HOME/.claude/plugins/data/bedrock-advisor-model-harness/bin/advisor-engine" version | grep -q "\"${GITHUB_REF_NAME}\""
          claude plugin list --json | grep -q '"id": *"bedrock-advisor@model-harness"'
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLAUDE_ADVISOR_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_REF_NAME/install.ps1" | iex *>&1 | Tee-Object -Variable lines
          $log = $lines | Out-String
          if ($log -notmatch 'Build provenance verified') { throw 'provenance was not verified' }
          $v = & "$HOME/.claude/plugins/data/bedrock-advisor-model-harness/bin/advisor-engine.exe" version | ConvertFrom-Json
          if ($v.version -ne $env:GITHUB_REF_NAME) { throw "engine is $($v.version)" }
          if (-not ((claude plugin list --json | ConvertFrom-Json) | Where-Object id -eq 'bedrock-advisor@model-harness')) { throw 'plugin not installed' }
